<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>พื้นฐานเซ็นเซอร์ในงานอุตสาหกรรม</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --card: #ffffff;
      --primary: #1e3a8a;
      --secondary: #2563eb;
      --accent: #dbeafe;
      --text: #1f2937;
      --muted: #6b7280;
      --line: #dfe7f5;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Segoe UI", Tahoma, sans-serif;
      background: linear-gradient(135deg, #eef4ff 0%, #f8fafc 100%);
      color: var(--text);
      padding: 24px;
    }

    .container {
      width: min(720px, 100%);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 20px;
      box-shadow: 0 16px 40px rgba(30, 58, 138, 0.08);
      overflow: hidden;
    }

    .header {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      padding: 32px 28px;
      text-align: center;
    }

    .header h1 {
      margin: 0;
      font-size: clamp(1.8rem, 3vw, 2.7rem);
      line-height: 1.4;
      font-weight: 700;
    }

    .content {
      padding: 32px 28px 24px;
    }

    .info {
      display: grid;
      gap: 18px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .info li {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--accent);
      border: 1px solid #cfe0ff;
      border-radius: 12px;
      padding: 16px 18px;
      font-size: 1.08rem;
      font-weight: 600;
    }

    .badge {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--primary);
      color: white;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      font-weight: 700;
      flex-shrink: 0;
    }

    .footer {
      padding: 0 28px 28px;
      color: var(--muted);
      text-align: center;
      font-size: 0.98rem;
    }

    @media (max-width: 520px) {
      .header, .content, .footer {
        padding-left: 18px;
        padding-right: 18px;
      }

      .info li {
        font-size: 1rem;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>20105-2022 พื้นฐานเซ็นเซอร์ในงานอุตสาหกรรม</h1>
    </div>

    <div class="content">
      <ul class="info">
        <li><span class="badge">01</span> ชื่อโครงงาน: KY-025</li>
        <li><span class="badge">02</span> จัดทำโดย: นาย ทีรธร กาญจนวิวิญ</li>
        <li><span class="badge">03</span> แผนกวิชาช่างเทคนิคคอมพิวเตอร์</li>
        <li><span class="badge">04</span> ระดับ: ปวช</li>
      </ul>
    </div>

    <div class="footer">
      งานวิจัยและโครงงานด้านเซ็นเซอร์อุตสาหกรรมเบื้องต้น
    </div>
  </div>
</body>
</html>
